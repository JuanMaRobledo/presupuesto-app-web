<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JMR · Presupuesto personal</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- PWA: instalable como app propia en computador (Chrome/Edge → "Instalar
       Presupuesto App") y en celular ("Agregar a pantalla de inicio"), con
       ícono y splash screen propios en vez de abrir como una pestaña más
       del navegador. Ver manifest.json y sw.js (service worker). -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#020617" />
  <!-- iOS/Safari no lee manifest.json para esto -- usa sus propias meta/link. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Presupuesto" />
</head>
<body>
  <div id="pantalla-login">
    <div class="login-card">
      <a class="jmr-mark" href="https://cartera-two-eta.vercel.app/" title="Centro financiero JMR">JMR</a>
      <h1>Presupuesto personal</h1>
      <p>
        Inicia sesión con la cuenta de Google que tiene acceso a tu hoja de presupuesto.
      </p>
      <button id="btn-login">Iniciar sesión con Google</button>
      <p><a href="index.html" class="link-portada">← Elegir otra versión</a></p>
    </div>
  </div>

  <div id="app">
    <div id="sidebar">
      <div class="brand-row">
        <a class="jmr-mark" href="https://cartera-two-eta.vercel.app/" title="Centro financiero JMR">JMR</a>
        <div class="brand-copy"><h2>Presupuesto</h2><p class="caption">Finanzas personales</p></div>
      </div>
      <p class="caption">Los datos se leen en vivo de tu Google Sheet.</p>
      <div id="nav-paginas"></div>
      <div id="backup-widget"></div>
      <a href="index.html" class="link-portada" style="display:block;margin-bottom:8px;">← Elegir otra versión</a>
      <button id="btn-logout">Cerrar sesión</button>
    </div>
    <div id="contenido"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  </script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sheets-api.js"></script>
  <script src="js/drive-api.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/ingresos-gastos.js"></script>
  <script src="js/parsers/colillas.js"></script>
  <script src="js/parsers/cuenta.js"></script>
  <script src="js/parsers/tarjeta.js"></script>
  <script src="js/pages/resumen.js"></script>
  <script src="js/pages/analisis.js"></script>
  <script src="js/pages/estados-financieros.js"></script>
  <script src="js/pages/verificar-datos.js"></script>
  <script src="js/pages/salud-datos.js"></script>
  <script src="js/pages/informe-inversiones.js"></script>
  <script src="js/pages/informe-presupuesto.js"></script>
  <script src="js/pages/presupuesto.js"></script>
  <script src="js/pages/egresos.js"></script>
  <script src="js/pages/deudas.js"></script>
  <script src="js/pages/importar-portafolio.js"></script>
  <script src="js/pages/inversiones.js"></script>
  <script src="js/pages/ingresos.js"></script>
  <script src="js/pages/facturacion.js"></script>
  <script src="js/pages/declaraciones.js"></script>
  <script src="js/pages/cargar.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
